[project]
name = "sphinx-evita"
dynamic = ["version"]
description = "Sphinx plugins and theme customizations for the EVITA project"
readme = "README.md"
authors = [{ name = "Ashwin V. Mohanan", email = "ashwin.mohanan@enccs.se" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  # "Development Status :: 5 - Production/Stable",
  "Framework :: Sphinx :: Extension",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Topic :: Documentation :: Sphinx",
]
dependencies = [
  "furo>=2025.9.25",
  "sphinx",
  "sphinx-lesson>=0.8.20",
  "sphinxcontrib-bibtex>=2.6.5",
]

[project.optional-dependencies]
docs = [
    "myst-parser>=4.0.1",
    "sphinx-design>=0.6.1",
    "sphinx-autodoc2>=0.5.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [{ include-group = "tests" }, { include-group = "docs" }]
docs = [
    "sphinx-evita[docs]",
    "sphinx-autobuild>=2025.8.25",
]
tests = ["pytest>=8.4.2", "pytest-cov>=7.0.0", "pytest-regressions>=2.8.3"]

[tool.pdm.version]
source = "scm"
fallback_version = "0.1.0b0"
